name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser (release artifacts only)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/omni_*.tar.gz
            dist/omni_*.zip
            dist/checksums.txt

      - name: Checkout Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: exploreomni/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Render Homebrew formula from release artifacts
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          bash bin/render-homebrew-formula.sh "${GITHUB_REF_NAME}" dist/checksums.txt homebrew-tap/Formula/omni.rb

      - name: Publish Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/omni.rb
          git diff --cached --quiet && exit 0
          git commit -m "Brew formula update for omni version ${GITHUB_REF_NAME}"
          git push origin HEAD:main

      - name: Notify omni-agent-skills
        if: ${{ !contains(github.ref_name, '-') }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          repository: exploreomni/omni-agent-skills
          event-type: cli-update
          client-payload: >-
            {
              "release_tag": "${{ github.ref_name }}",
              "release_url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}"
            }
