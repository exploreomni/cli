name: Notify Docs on Changes

on:
  # Release-only: the receiver diffs previous tag..this tag, so one dispatch per
  # release carries every change since the last one.
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    if: '!github.event.release.prerelease'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mintlify-omni docs generation
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          jq -n --arg tag "$RELEASE_TAG" \
            '{event_type: "generate-docs", client_payload: {source: "cli", release_tag: $tag}}' \
            | gh api --method POST repos/exploreomni/mintlify-omni/dispatches --input -
