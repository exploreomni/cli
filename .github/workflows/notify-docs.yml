name: Notify Docs on Changes

on:
  # Release-only: the receiver diffs previous tag..this tag, so one dispatch per
  # release carries every change since the last one.
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    if: '!github.event.release.prerelease'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mintlify-omni docs generation
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          repository: exploreomni/mintlify-omni
          event-type: generate-docs
          client-payload: '{"source": "cli", "release_tag": ${{ toJSON(github.event.release.tag_name) }}}'
